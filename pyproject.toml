[project]
name = "raze"
version = "0.0.1"
description = "Raze — an offensive-security agent built on a System One model (Jev family)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Joás Santos" }, { name = "Raze contributors" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
raze = "raze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raze"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# runner is executed directly (python benchmarks/runner.py); it inserts src/ on
# sys.path before importing the package, so imports are intentionally late.
"benchmarks/runner.py" = ["E402", "I001"]
"benchmarks/export_dataset.py" = ["E402", "I001"]
