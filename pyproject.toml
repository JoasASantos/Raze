[project]
name = "offsec-one"
version = "0.0.1"
description = "Offensive-security agent built on Raze, a System One model in the Jev family."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "OffSec One contributors" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
offsec-one = "offsec_one.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raze", "src/offsec_one"]

[tool.ruff]
line-length = 100
target-version = "py310"
